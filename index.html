<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>BossGit — learn Git and GitHub from zero to mastery</title>
    <meta name="description" content="A free course with a real Git terminal in your browser. From your first commit to rebase, reflog and Git internals." />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#F5F2E9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0B1A2E" media="(prefers-color-scheme: dark)" />
    <script>
      try { var t = localStorage.getItem('bossgit-theme'); if (t) document.documentElement.dataset.theme = t } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root">
      <!-- shown while the app loads; React replaces it on first render -->
      <style>
        .boot{position:fixed;inset:0;display:grid;place-items:center;background:#f5f2e9;color:#14213d;font:12px/1 ui-monospace,Menlo,monospace;letter-spacing:.14em;text-transform:uppercase}
        .boot{background-image:linear-gradient(rgba(20,33,61,.055) 1px,transparent 1px),linear-gradient(90deg,rgba(20,33,61,.055) 1px,transparent 1px);background-size:28px 28px}
        @media (prefers-color-scheme:dark){html:not([data-theme=light]) .boot{background-color:#0b1a2e;color:#e9eff9}}
        html[data-theme=dark] .boot{background-color:#0b1a2e;color:#e9eff9}
        .boot path{stroke-dasharray:1;stroke-dashoffset:1;animation:bd 1.8s cubic-bezier(.6,.05,.3,1) infinite}
        .boot .b2{animation-delay:.25s}.boot .b3{animation-delay:.5s}
        .boot circle{transform-box:fill-box;transform-origin:center;animation:bp 1.8s ease-in-out infinite}
        .boot small{display:block;margin-top:18px;opacity:.6;text-align:center}
        @keyframes bd{0%{stroke-dashoffset:1}55%,80%{stroke-dashoffset:0}100%{stroke-dashoffset:-1}}
        @keyframes bp{0%,30%{transform:scale(0)}50%,85%{transform:scale(1)}100%{transform:scale(0)}}
      </style>
      <div class="boot" role="status" aria-label="Loading BossGit">
        <div>
          <svg width="76" height="76" viewBox="0 0 48 48" aria-hidden="true" style="display:block;margin:0 auto">
            <g fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <path pathLength="1" d="M14 7v34"/><path class="b2" pathLength="1" d="M14 7h11a8 8 0 0 1 0 16H14"/><path class="b3" pathLength="1" d="M14 23h13a9 9 0 0 1 0 18H14"/>
            </g>
            <circle cx="33" cy="15" r="3.6" fill="#f0511b"/>
          </svg>
          <small>git init…</small>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
